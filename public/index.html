<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlantis TrackStat & Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: #0f1117; font-family: 'Segoe UI', sans-serif; }
    .sidebar { width: 220px; min-height: 100vh; background: #16181f; border-right: 1px solid #2a2d3a; }
    .main { flex: 1; overflow-x: auto; }
    .stat-card { background: #1e2130; border: 1px solid #2a2d3a; border-radius: 12px; transition: transform 0.2s; }
    .stat-card:hover { transform: translateY(-2px); border-color: #06b6d4; }
    .table-row:hover { background: #1e2130; }
    .badge { border-radius: 6px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
    .online-dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; display: inline-block; box-shadow: 0 0 8px #22c55e; }
    .offline-dot { width: 10px; height: 10px; border-radius: 50%; background: #6b7280; display: inline-block; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f1117; }
    ::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
    select option { background: #16181f; color: #e5e7eb; }
  </style>
</head>
<body class="text-gray-200 flex">

  <div class="sidebar flex flex-col p-4 gap-2 fixed top-0 left-0 h-full z-10">
    <div class="flex items-center gap-2 mb-6 mt-2">
      <i class="fa-solid fa-dragon text-cyan-400 text-xl"></i>
      <span class="font-bold text-white text-lg">Atlantis Stat</span>
    </div>

    <div class="text-xs text-gray-500 uppercase mb-2">Games</div>
    <div class="flex items-center gap-3 bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 rounded-lg px-3 py-2 cursor-pointer">
      <img src="https://i.imgur.com/8Q7X2X5.png" class="w-6 h-6 rounded">
      <span class="font-semibold">Blox Fruits</span>
    </div>

    <div class="mt-auto">
      <div class="text-xs text-gray-500 uppercase mb-2">Menu</div>
      <div class="flex items-center gap-3 text-gray-400 hover:text-white rounded-lg px-3 py-2 cursor-pointer transition-colors">
        <i class="fa-solid fa-chart-line w-4 text-center"></i>
        <span>Chart</span>
      </div>
      <div class="flex items-center gap-3 text-gray-400 hover:text-white rounded-lg px-3 py-2 cursor-pointer transition-colors">
        <i class="fa-solid fa-share-nodes w-4 text-center"></i>
        <span>Share</span>
      </div>
    </div>
  </div>

  <div class="main ml-[220px] p-6">

    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-white flex items-center gap-3">
        <i class="fa-solid fa-gamepad text-cyan-400"></i> Command Center
      </h1>
      <div class="flex items-center gap-3">
        <div class="relative">
          <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
          <input id="searchInput" type="text"
                 placeholder="Tìm kiếm account..."
                 class="bg-[#1e2130] border border-[#2a2d3a] rounded-lg pl-9 pr-4 py-2 text-sm outline-none focus:border-cyan-500 w-64 transition-colors">
        </div>
        <button onclick="loadData()" class="bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold px-4 py-2 rounded-lg text-sm shadow-lg shadow-cyan-500/20 transition-all flex items-center gap-2">
          <i class="fa-solid fa-rotate-right"></i> Refresh
        </button>
      </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="overview">
      <div class="stat-card p-4">
        <div class="flex items-center gap-2 text-xs text-gray-400 mb-2 font-bold uppercase"><i class="fa-solid fa-users"></i> Online / Total</div>
        <div class="text-2xl font-bold text-white" id="ov-online">0 / 0</div>
      </div>
      <div class="stat-card p-4">
        <div class="flex items-center gap-2 text-xs text-gray-400 mb-2 font-bold uppercase"><i class="fa-solid fa-money-bill-wave text-green-400"></i> Tổng Beli</div>
        <div class="text-2xl font-bold text-green-400" id="ov-beli">0</div>
      </div>
      <div class="stat-card p-4">
        <div class="flex items-center gap-2 text-xs text-gray-400 mb-2 font-bold uppercase"><i class="fa-solid fa-gem text-purple-400"></i> Tổng Fragment</div>
        <div class="text-2xl font-bold text-purple-400" id="ov-frag">0</div>
      </div>
      <div class="stat-card p-4">
        <div class="flex items-center gap-2 text-xs text-gray-400 mb-2 font-bold uppercase"><i class="fa-solid fa-heart text-red-400"></i> Tổng Heart</div>
        <div class="text-2xl font-bold text-red-400" id="ov-heart">0</div>
      </div>
    </div>

    <div class="bg-[#16181f] rounded-xl border border-[#2a2d3a] overflow-hidden shadow-xl">
      <div class="flex items-center justify-between px-6 py-4 border-b border-[#2a2d3a] bg-[#1a1d27]">
        <div class="text-sm font-semibold text-gray-300 flex items-center gap-2">
          <i class="fa-solid fa-list-ul"></i> Danh sách Tài khoản (<span id="total-count" class="text-cyan-400">0</span>)
        </div>
        <div class="text-xs text-gray-500 flex items-center gap-1"><i class="fa-solid fa-circle-notch animate-spin"></i> Auto-sync: 5s</div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-[11px] text-gray-400 uppercase tracking-wider border-b border-[#2a2d3a] bg-[#16181f]">
              <th class="px-6 py-3 text-left font-semibold">Account</th>
              <th class="px-4 py-3 text-left font-semibold">Details</th>
              <th class="px-4 py-3 text-left font-semibold">Equipped</th>
              <th class="px-4 py-3 text-center font-semibold">Inventory</th>
              <th class="px-4 py-3 text-left font-semibold">System</th>
              <th class="px-4 py-3 text-center font-semibold text-cyan-400">⚡ Control</th>
            </tr>
          </thead>
          <tfoot id="tableFoot" class="hidden">
            <tr><td colspan="6" class="text-center py-10 text-gray-500">Đang lọc dữ liệu...</td></tr>
          </tfoot>
          <tbody id="tableBody">
            <tr>
              <td colspan="6" class="text-center py-20 text-gray-500 flex flex-col items-center justify-center">
                <i class="fa-solid fa-spinner animate-spin text-3xl mb-3 text-cyan-500/50"></i>
                Đang tải dữ liệu từ Vercel...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // --- CẤU HÌNH API ---
    const API_DATA = '/api/data';
    const API_COMMAND = '/api/command';
    const API_AVATAR = '/api/avatar?userid=';

    let allAccounts = {};

    function isOnline(acc) {
      const last = new Date(acc.lastRaw || 0);
      return (Date.now() - last.getTime()) < 60000;
    }

    function fmtNum(n) {
      if (!n) return '0';
      const num = parseFloat(String(n).replace(/,/g, ''));
      if (num >= 1e9) return (num/1e9).toFixed(2) + 'B';
      if (num >= 1e6) return (num/1e6).toFixed(2) + 'M';
      if (num >= 1e3) return (num/1e3).toFixed(1) + 'K';
      return String(n);
    }

    function updateOverview(accounts) {
      const list = Object.values(accounts);
      const online = list.filter(a => isOnline(a)).length;
      const total = list.length;
      let beli = 0, frag = 0, heart = 0;

      list.forEach(a => {
        beli  += parseFloat(String(a.beli  || '0').replace(/,/g,'')) || 0;
        frag  += parseFloat(String(a.frag  || '0').replace(/,/g,'')) || 0;
        heart += parseInt(a.heart || 0);
      });

      document.getElementById('ov-online').textContent = `${online} / ${total}`;
      document.getElementById('ov-beli').textContent   = fmtNum(beli);
      document.getElementById('ov-frag').textContent   = fmtNum(frag);
      document.getElementById('ov-heart').textContent  = heart;
      document.getElementById('total-count').textContent = total;
    }

    function renderTable(accounts) {
      const tbody = document.getElementById('tableBody');
      const list = Object.values(accounts);

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-20 text-gray-500">Không tìm thấy tài khoản nào...</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(acc => {
        const online = isOnline(acc);
        const dot = online 
          ? `<span class="online-dot mr-2" title="Online"></span>` 
          : `<span class="offline-dot mr-2" title="Offline"></span>`;

        // TẠO DROPDOWN VŨ KHÍ TỰ ĐỘNG
        let weaponOptions = '<option value="">-- Chọn VK / Hệ --</option>';
        if (acc.weapon_list && acc.weapon_list.length > 0) {
            let sortedList = [...acc.weapon_list].sort((a,b) => b.mastery - a.mastery);
            sortedList.forEach(w => {
                let icon = w.type === 'Sword' ? '⚔️' : (w.type === 'Blox Fruit' ? '🍎' : '🔫');
                let stat = w.type === 'Blox Fruit' ? 'Demon Fruit' : w.type;
                weaponOptions += `<option value="${w.name}|${stat}">${icon} ${w.name} (Mas: ${w.mastery})</option>`;
            });
        } else {
            weaponOptions = '<option value="">(Không có dữ liệu VK)</option>';
        }

        return `
          <tr class="table-row border-b border-[#2a2d3a] transition-all">
            
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <img src="${API_AVATAR}${acc.userid}" 
                     class="w-11 h-11 rounded-lg border border-cyan-500/20 bg-[#0f1117]" 
                     onerror="this.src='https://i.imgur.com/8Q7X2X5.png'">
                <div>
                  <div class="flex items-center font-bold text-white text-[15px]">
                    ${dot}${acc.player}
                  </div>
                  <div class="text-[11px] text-gray-500 font-mono mt-0.5">ID: ${acc.userid}</div>
                </div>
              </div>
            </td>

            <td class="px-4 py-4">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <span class="text-[11px] text-gray-500 w-8 font-bold uppercase">Lv</span>
                  <span class="text-sm font-bold text-white">${acc.level || 0}</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-[11px] text-gray-500 w-8 font-bold uppercase">$</span>
                  <span class="text-xs font-semibold text-green-400">${fmtNum(acc.beli)}</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-[11px] text-gray-500 w-8 font-bold uppercase">F</span>
                  <span class="text-xs font-semibold text-purple-400">${fmtNum(acc.frag)}</span>
                </div>
              </div>
            </td>

            <td class="px-4 py-4">
              <div class="space-y-1.5 flex flex-col items-start">
                <span class="badge bg-red-500/10 border border-red-500/20 text-red-400">🍎 ${acc.fruit || 'Không'}</span>
                <span class="badge bg-blue-500/10 border border-blue-500/20 text-blue-400">⚔️ ${acc.sword || 'Không'}</span>
                <span class="badge bg-orange-500/10 border border-orange-500/20 text-orange-400">🥊 ${acc.fighting || 'Không'}</span>
              </div>
            </td>

            <td class="px-4 py-4">
              <div class="grid grid-cols-2 gap-2 text-xs bg-[#0f1117] p-2 rounded-lg border border-[#2a2d3a]">
                <div class="flex justify-between items-center"><span class="text-gray-500">❤️ Tim</span> <span class="text-red-400 font-bold">${acc.heart || 0}</span></div>
                <div class="flex justify-between items-center"><span class="text-gray-500">🛡️ Vảy</span> <span class="text-cyan-400 font-bold">${acc.scale || 0}</span></div>
                <div class="flex justify-between items-center"><span class="text-gray-500">🌟 Myt</span> <span class="text-purple-400 font-bold">${acc.mythic || 0}</span></div>
                <div class="flex justify-between items-center"><span class="text-gray-500">⭐ Leg</span> <span class="text-yellow-400 font-bold">${acc.legend || 0}</span></div>
              </div>
            </td>

            <td class="px-4 py-4">
              <div class="space-y-1 text-xs">
                <div class="flex justify-between w-24"><span class="text-gray-500">FPS:</span> <span class="text-emerald-400 font-bold">${acc.fps || 0}</span></div>
                <div class="flex justify-between w-24"><span class="text-gray-500">Ping:</span> <span class="text-orange-400">${acc.ping || 0}ms</span></div>
                <div class="flex justify-between w-24"><span class="text-gray-500">Treo:</span> <span class="text-cyan-400">${acc.treo || '00:00'}</span></div>
              </div>
            </td>

            <td class="px-4 py-4 text-center">
              <div class="flex flex-col gap-1 items-center">
                <select id="cmd-${acc.userid}" class="bg-[#0f1117] border border-[#2a2d3a] text-gray-300 text-[11px] rounded p-1 outline-none w-36 focus:border-cyan-500 transition-colors mb-1">
                  ${weaponOptions}
                </select>
                <button onclick="sendCommand('${acc.userid}', 'equip_weapon')" class="w-36 bg-emerald-600/20 hover:bg-emerald-600 border border-emerald-500/50 text-emerald-400 hover:text-white text-[10px] font-bold py-1 px-2 rounded transition-all flex items-center justify-center gap-1">
                  <i class="fa-solid fa-hand-fist"></i> TRANG BỊ NHANH
                </button>
                <button onclick="sendCommand('${acc.userid}', 'swap_build')" class="w-36 bg-cyan-600/20 hover:bg-cyan-600 border border-cyan-500/50 text-cyan-400 hover:text-white text-[10px] font-bold py-1 px-2 rounded transition-all flex items-center justify-center gap-1">
                  <i class="fa-solid fa-bolt"></i> TẨY ĐIỂM & ĐỔI HỆ
                </button>
              </div>
            </td>

          </tr>
        `;
      }).join('');
    }

    // --- HÀM THỰC THI LỆNH GỬI LÊN VERCEL KV ---
    async function sendCommand(userid, action) {
      const selectEl = document.getElementById(`cmd-${userid}`);
      const selectedVal = selectEl.value;
      
      if (!selectedVal) {
        alert('⚠️ Vui lòng chọn vũ khí trước!');
        return;
      }
      
      const [weapon, stat] = selectedVal.split('|');
      
      // Hiển thị cảnh báo xác nhận dựa theo loại lệnh
      if (action === 'swap_build') {
        if (!confirm(`Xác nhận TẨY ĐIỂM (tốn 2500 Frag), max điểm vào [${stat}] và trang bị [${weapon}]?`)) return;
      } else {
        if (!confirm(`Xác nhận TRANG BỊ NHANH vũ khí [${weapon}]? (Không tẩy điểm)`)) return;
      }

      try {
        const res = await fetch(`${API_COMMAND}?userid=${userid}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: action, weapon: weapon, main_stat: stat })
        });
        
        if (res.ok) {
          alert(`✅ Lệnh thành công! Đang chờ Roblox thực thi...`);
        } else {
          alert("❌ Lỗi gửi lệnh lên Server!");
        }
      } catch (err) {
        alert("❌ Lỗi kết nối đến Server!");
      }
    }

    // --- LOGIC LOAD DATA & SEARCH ---
    async function loadData() {
      try {
        const res = await fetch(API_DATA);
        allAccounts = await res.json();
        
        const keyword = document.getElementById('searchInput').value.trim();
        if(!keyword) {
            updateOverview(allAccounts);
            renderTable(allAccounts);
        }
      } catch(e) {
        console.log("Lỗi tải dữ liệu", e);
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase();
      const filtered = {};
      Object.keys(allAccounts).forEach(k => {
        if (allAccounts[k].player.toLowerCase().includes(keyword)) {
          filtered[k] = allAccounts[k];
        }
      });
      renderTable(filtered);
    });

    // Khởi chạy
    setInterval(loadData, 5000);
    loadData();
  </script>
</body>
</html>
