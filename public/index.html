<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlantis TrackStat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: #0f1117; font-family: 'Segoe UI', sans-serif; }
    .sidebar { width: 220px; min-height: 100vh; background: #16181f; border-right: 1px solid #2a2d3a; }
    .main { flex: 1; overflow-x: auto; }
    .stat-card { background: #1e2130; border: 1px solid #2a2d3a; border-radius: 12px; }
    .table-row:hover { background: #1e2130; }
    .badge { border-radius: 6px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
    .online-dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; display: inline-block; }
    .offline-dot { width: 10px; height: 10px; border-radius: 50%; background: #6b7280; display: inline-block; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f1117; }
    ::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 3px; }
  </style>
</head>
<body class="text-gray-200 flex">

  <!-- Sidebar -->
  <div class="sidebar flex flex-col p-4 gap-2 fixed top-0 left-0 h-full z-10">
    <div class="flex items-center gap-2 mb-6 mt-2">
      <i class="fa-solid fa-dragon text-cyan-400 text-xl"></i>
      <span class="font-bold text-white text-lg">Atlantis Stat</span>
    </div>

    <div class="text-xs text-gray-500 uppercase mb-2">Games</div>
    <div class="flex items-center gap-3 bg-cyan-500/10 text-cyan-400 rounded-lg px-3 py-2 cursor-pointer">
      <img src="https://i.imgur.com/8Q7X2X5.png" class="w-6 h-6 rounded">
      <span class="font-semibold">Blox Fruits</span>
    </div>

    <div class="mt-auto">
      <div class="text-xs text-gray-500 uppercase mb-2">Menu</div>
      <div class="flex items-center gap-3 text-gray-400 hover:text-white rounded-lg px-3 py-2 cursor-pointer">
        <i class="fa-solid fa-chart-line"></i>
        <span>Chart</span>
      </div>
      <div class="flex items-center gap-3 text-gray-400 hover:text-white rounded-lg px-3 py-2 cursor-pointer">
        <i class="fa-solid fa-share-nodes"></i>
        <span>Share</span>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main ml-[220px] p-6">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-white flex items-center gap-3">
        <i class="fa-solid fa-dragon text-cyan-400"></i> Blox Fruits
      </h1>
      <div class="flex items-center gap-3">
        <input id="searchInput" type="text"
               placeholder="🔎 Tìm kiếm..."
               class="bg-[#1e2130] border border-[#2a2d3a] rounded-lg px-4 py-2 text-sm outline-none focus:border-cyan-500 w-56">
        <button onclick="loadData()" class="bg-cyan-500 hover:bg-cyan-600 text-black font-bold px-4 py-2 rounded-lg text-sm">
          <i class="fa-solid fa-rotate-right"></i> Refresh
        </button>
      </div>
    </div>

    <!-- Stats tổng quan -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="overview">
      <div class="stat-card p-4">
        <div class="text-xs text-gray-400 mb-1">ONLINE / TOTAL</div>
        <div class="text-2xl font-bold text-white" id="ov-online">0 / 0</div>
      </div>
      <div class="stat-card p-4">
        <div class="text-xs text-gray-400 mb-1">TỔNG BELI</div>
        <div class="text-2xl font-bold text-yellow-400" id="ov-beli">0</div>
      </div>
      <div class="stat-card p-4">
        <div class="text-xs text-gray-400 mb-1">TỔNG FRAGMENT</div>
        <div class="text-2xl font-bold text-purple-400" id="ov-frag">0</div>
      </div>
      <div class="stat-card p-4">
        <div class="text-xs text-gray-400 mb-1">TỔNG HEART</div>
        <div class="text-2xl font-bold text-red-400" id="ov-heart">0</div>
      </div>
    </div>

    <!-- Bảng dữ liệu -->
    <div class="bg-[#16181f] rounded-xl border border-[#2a2d3a] overflow-hidden">
      <div class="flex items-center justify-between px-6 py-4 border-b border-[#2a2d3a]">
        <div class="text-sm text-gray-400" id="total-count">0 accounts</div>
        <div class="text-xs text-gray-500">Cập nhật mỗi 5 giây</div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-xs text-gray-500 uppercase border-b border-[#2a2d3a]">
              <th class="px-6 py-3 text-left">Account</th>
              <th class="px-4 py-3 text-left">Details</th>
              <th class="px-4 py-3 text-left">Fruit</th>
              <th class="px-4 py-3 text-left">Sword</th>
              <th class="px-4 py-3 text-left">Fighting</th>
              <th class="px-4 py-3 text-center">❤️ Heart</th>
              <th class="px-4 py-3 text-center">🛡️ Scale</th>
              <th class="px-4 py-3 text-center">🌟 Mythic</th>
              <th class="px-4 py-3 text-center">⭐ Legend</th>
              <th class="px-4 py-3 text-left">System</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="10" class="text-center py-20 text-gray-500">Chưa có dữ liệu...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let allAccounts = {};

    function isOnline(acc) {
      const last = new Date(acc.lastRaw || 0);
      return (Date.now() - last.getTime()) < 30000;
    }

    function fmtNum(n) {
      if (!n) return '0';
      const num = parseFloat(String(n).replace(/,/g, ''));
      if (num >= 1e9) return (num/1e9).toFixed(2) + 'B';
      if (num >= 1e6) return (num/1e6).toFixed(2) + 'M';
      if (num >= 1e3) return (num/1e3).toFixed(1) + 'K';
      return String(n);
    }

    function updateOverview(accounts) {
      const list = Object.values(accounts);
      const online = list.filter(a => isOnline(a)).length;
      const total = list.length;
      let beli = 0, frag = 0, heart = 0;

      list.forEach(a => {
        beli  += parseFloat(String(a.beli  || '0').replace(/,/g,'')) || 0;
        frag  += parseFloat(String(a.frag  || '0').replace(/,/g,'')) || 0;
        heart += parseInt(a.heart || 0);
      });

      document.getElementById('ov-online').textContent = `${online} / ${total}`;
      document.getElementById('ov-beli').textContent   = fmtNum(beli);
      document.getElementById('ov-frag').textContent   = fmtNum(frag);
      document.getElementById('ov-heart').textContent  = heart;
      document.getElementById('total-count').textContent = `${total} accounts`;
    }

    function renderTable(accounts) {
      const tbody = document.getElementById('tableBody');
      const list = Object.values(accounts);

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" class="text-center py-20 text-gray-500">Chưa có dữ liệu...</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(acc => {
        const online = isOnline(acc);
        const dot = online
          ? `<span class="online-dot mr-2"></span>`
          : `<span class="offline-dot mr-2"></span>`;

        return `
          <tr class="table-row border-b border-[#2a2d3a] transition-all">
            <!-- Account -->
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <img src="/api/avatar?userid=${acc.userid}"
                     class="w-10 h-10 rounded-lg border border-cyan-500/30"
                     onerror="this.src='https://i.imgur.com/4f7v7zL.png'">
                <div>
                  <div class="flex items-center font-semibold text-white">
                    ${dot}${acc.player}
                  </div>
                  <div class="text-xs text-gray-500 mt-0.5">${acc.lastUpdate || ''}</div>
                </div>
              </div>
            </td>

            <!-- Details -->
            <td class="px-4 py-4">
              <div class="space-y-1.5">
                <div class="flex items-center gap-2">
                  <span class="text-xs text-gray-400 w-12">Level</span>
                  <span class="badge bg-blue-500/20 text-blue-300">${acc.level || 0}</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-xs text-gray-400 w-12">Beli</span>
                  <span class="badge bg-yellow-500/20 text-yellow-300">${fmtNum(acc.beli)}</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-xs text-gray-400 w-12">Frag</span>
                  <span class="badge bg-purple-500/20 text-purple-300">${fmtNum(acc.frag)}</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-xs text-gray-400 w-12">Race</span>
                  <span class="badge bg-pink-500/20 text-pink-300">${acc.race || 'Unknown'}</span>
                </div>
              </div>
            </td>

            <!-- Fruit -->
            <td class="px-4 py-4">
              <span class="badge bg-red-500/20 text-red-300">
                🍎 ${acc.fruit || 'Không'}
              </span>
            </td>

            <!-- Sword -->
            <td class="px-4 py-4">
              <span class="badge bg-blue-500/20 text-blue-300">
                ⚔️ ${acc.sword || 'Không'}
              </span>
            </td>

            <!-- Fighting -->
            <td class="px-4 py-4">
              <span class="badge bg-orange-500/20 text-orange-300">
                🥊 ${acc.fighting || 'Không'}
              </span>
            </td>

            <!-- Heart -->
            <td class="px-4 py-4 text-center">
              <span class="text-red-400 font-bold text-lg">${acc.heart || 0}</span>
            </td>

            <!-- Scale -->
            <td class="px-4 py-4 text-center">
              <span class="text-blue-400 font-bold text-lg">${acc.scale || 0}</span>
            </td>

            <!-- Mythic -->
            <td class="px-4 py-4 text-center">
              <span class="text-purple-400 font-bold text-lg">${acc.mythic || 0}</span>
            </td>

            <!-- Legend -->
            <td class="px-4 py-4 text-center">
              <span class="text-yellow-400 font-bold text-lg">${acc.legend || 0}</span>
            </td>

            <!-- System -->
            <td class="px-4 py-4">
              <div class="space-y-1 text-xs">
                <div>FPS: <span class="text-emerald-400">${acc.fps || 0}</span></div>
                <div>Ping: <span class="text-orange-400">${acc.ping || 0}ms</span></div>
                <div>Treo: <span class="text-cyan-400">${acc.treo || '00:00:00'}</span></div>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function loadData() {
      try {
        const res = await fetch('/api/data');
        allAccounts = await res.json();
        updateOverview(allAccounts);
        renderTable(allAccounts);
      } catch(e) {
        console.log("Lỗi tải dữ liệu");
      }
    }

    // Tìm kiếm
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase();
      const filtered = {};
      Object.keys(allAccounts).forEach(k => {
        if (allAccounts[k].player.toLowerCase().includes(keyword)) {
          filtered[k] = allAccounts[k];
        }
      });
      renderTable(filtered);
    });

    setInterval(loadData, 5000);
    loadData();
  </script>
</body>
</html>
