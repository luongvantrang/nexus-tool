<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLANTIS TRACKSTAT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: #05060f; }
    .neon-card { background: #0f1321; border: 2px solid transparent; background-image: linear-gradient(#0f1321, #0f1321), linear-gradient(90deg, #00ffff, #ff00ff); background-origin: border-box; background-clip: padding-box, border-box; }
    .avatar-box { border: 3px solid #00ffff; box-shadow: 0 0 35px #00ffff80; background: #1a2333; }
    .avatar { transition: all 0.4s; }
    .avatar-error { filter: brightness(0.6); }
  </style>
</head>
<body class="text-gray-200 p-6">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-5xl font-bold text-center mb-10 text-cyan-400">👑 ATLANTIS TRACKSTAT</h1>

    <div class="max-w-xl mx-auto mb-10">
      <input id="searchInput" type="text" 
             class="w-full bg-[#0f1321] border border-cyan-400/30 focus:border-cyan-400 rounded-3xl py-4 px-6 text-lg outline-none"
             placeholder="🔎 Tìm kiếm tên nhân vật...">
    </div>

    <div id="accounts" class="grid grid-cols-1 xl:grid-cols-2 gap-8"></div>
  </div>

  <script>
    let allAccounts = {};

    async function loadData() {
      try {
        const res = await fetch('/api/data');
        allAccounts = await res.json();
        renderAccounts(allAccounts);
      } catch(e) { console.log("Lỗi tải dữ liệu"); }
    }

    function renderAccounts(accounts) {
      const container = document.getElementById('accounts');
      container.innerHTML = '';

      if (Object.keys(accounts).length === 0) {
        container.innerHTML = `<p class="text-center text-gray-400 text-2xl py-20">Chưa có dữ liệu...</p>`;
        return;
      }

      Object.values(accounts).forEach(acc => {
        const card = document.createElement('div');
        card.className = "neon-card rounded-3xl overflow-hidden";
        card.innerHTML = `
          <div class="h-3 bg-gradient-to-r from-cyan-400 to-pink-500"></div>
          <div class="p-8 flex gap-8">
            <!-- Avatar -->
            <div class="avatar-box w-44 h-44 rounded-2xl overflow-hidden flex-shrink-0">
              <img src="https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${acc.userid}&size=420x420&format=Png&isCircular=false" 
                   class="avatar w-full h-full object-cover"
                   onerror="this.src='https://i.imgur.com/4f7v7zL.png'; this.classList.add('avatar-error');">
            </div>

            <!-- Thông tin -->
            <div class="flex-1">
              <h2 class="text-4xl font-bold text-white">${acc.player}</h2>
              <p class="text-cyan-400 text-xl">Level ${acc.level} • ${acc.race || 'Unknown'}</p>

              <div class="mt-8 flex gap-12">
                <div>
                  <div class="text-yellow-300 text-3xl font-bold">💰 ${acc.beli}</div>
                  <div class="text-xs text-gray-400">Beli</div>
                </div>
                <div>
                  <div class="text-purple-300 text-3xl font-bold">⭕ ${acc.frag}</div>
                  <div class="text-xs text-gray-400">Fragment</div>
                </div>
              </div>

              <div class="mt-8 grid grid-cols-2 gap-y-3 text-sm">
                <div>🍎 Fruit: <span class="text-white">${acc.fruit || 'Không'}</span></div>
                <div>⚔️ Sword: <span class="text-white">${acc.sword || 'Không'}</span></div>
                <div>🥊 Fighting: <span class="text-white">${acc.fighting || 'Không'}</span></div>
                <div>🌟 Aura: <span class="text-white">${acc.aura || 'Không'}</span></div>
              </div>

              <div class="mt-10 flex justify-around border-t border-gray-700 pt-8">
                <div class="text-center"><div class="text-5xl">❤️</div><div class="text-2xl font-bold text-red-400">${acc.heart || 0}</div><div class="text-xs text-gray-400">Heart</div></div>
                <div class="text-center"><div class="text-5xl">🛡️</div><div class="text-2xl font-bold text-blue-400">${acc.scale || 0}</div><div class="text-xs text-gray-400">Scale</div></div>
                <div class="text-center"><div class="text-5xl">🌟</div><div class="text-2xl font-bold text-purple-400">${acc.mythic || 0}</div><div class="text-xs text-gray-400">Mythic</div></div>
                <div class="text-center"><div class="text-5xl">⭐</div><div class="text-2xl font-bold text-yellow-400">${acc.legend || 0}</div><div class="text-xs text-gray-400">Legend</div></div>
              </div>
            </div>
          </div>

          <div class="bg-black/60 px-8 py-5 flex justify-between text-sm">
            <div>FPS: <span class="text-emerald-400">${acc.fps}</span> • Ping: <span class="text-orange-400">${acc.ping}ms</span></div>
            <div>Treo: <span class="text-cyan-400">${acc.treo}</span></div>
            <div class="text-gray-500">${acc.lastUpdate}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Tìm kiếm
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase();
      const filtered = {};
      Object.keys(allAccounts).forEach(k => {
        if (allAccounts[k].player.toLowerCase().includes(keyword)) filtered[k] = allAccounts[k];
      });
      renderAccounts(filtered);
    });

    setInterval(loadData, 7000);
    loadData();
  </script>
</body>
</html>
