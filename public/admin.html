<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Atlantis Admin</title><link rel="stylesheet" href="/admin.css"></head><body><div id="login" class="login"><div class="login-card"><h1>Admin Login</h1><p>Nhập mật khẩu admin</p><input id="adminPw" type="password" placeholder="Mật khẩu"><button onclick="loginAdmin()">Đăng nhập</button><div id="loginErr"></div></div></div><div id="app" class="app hidden"><aside><h2>ATLANTIS</h2><a class="active">Orders</a><a href="/">Website</a><a href="#" onclick="logout()">Logout</a></aside><main><header><div><h1>Quản lý đơn</h1><p id="me">Admin</p></div><button onclick="loadOrders()">Refresh</button></header><section class="stats"><div><span>Total</span><b id="stTotal">0</b></div><div><span>Pending</span><b id="stPending">0</b></div><div><span>Doing</span><b id="stDoing">0</b></div><div><span>Error</span><b id="stError">0</b></div><div><span>Done</span><b id="stDone">0</b></div></section><section class="filters"><button class="active" onclick="setFilter('all',this)">All</button><button onclick="setFilter('pending',this)">Pending</button><button onclick="setFilter('doing',this)">Doing</button><button onclick="setFilter('error',this)">Error</button><button onclick="setFilter('completed',this)">Done</button></section><section id="orders" class="orders"></section></main></div><script src="/admin.js"></script></body></html>
